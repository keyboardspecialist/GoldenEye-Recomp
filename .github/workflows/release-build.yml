name: Release build

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  SDK_VERSION: 0.10.0
  SDK_SHA256: 0388edb3f8fb1444f1b0ad5d440cb02d9690ac20a76b04fd6b7dcc19f59328a6
  GAME_ASSETS_REPOSITORY: ${{ vars.GAME_ASSETS_REPOSITORY || format('{0}/goldeneye-build-inputs', github.repository_owner) }}
  GAME_ASSETS_TAG: ${{ vars.GAME_ASSETS_TAG || 'build-inputs' }}

jobs:
  build-linux:
    name: Linux x86-64 Release
    runs-on: ubuntu-24.04
    # Match the SDK's glibc 2.35 baseline for SteamOS compatibility.
    container: ubuntu:22.04
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
      CXX: g++-14
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap build container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git gnupg software-properties-common

      - name: Check out source
        uses: actions/checkout@v4

      - name: Check game executable source
        env:
          GAME_ASSETS_TOKEN: ${{ secrets.GAME_ASSETS_TOKEN }}
        run: |
          if [[ -z "$GAME_ASSETS_TOKEN" ]]; then
            echo "::error::Set GAME_ASSETS_TOKEN to a token with Contents: Read access to the private build-inputs repository."
            exit 1
          fi

      - name: Install build dependencies
        run: |
          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          apt-get update
          apt-get install -y --no-install-recommends \
            g++-14 ninja-build unzip python3-pip gh \
            libx11-xcb-dev libwayland-dev libvulkan-dev
          # Ubuntu 22.04's CMake 3.22 cannot read the project's presets.
          python3 -m pip install --no-cache-dir cmake==3.31.6

      - name: Restore ReXGlue SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: rexglue/linux-amd64
          key: rexglue-${{ runner.os }}-amd64-${{ env.SDK_VERSION }}-${{ env.SDK_SHA256 }}

      - name: Download ReXGlue SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          archive="$RUNNER_TEMP/rexglue-sdk.zip"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rexglue/rexglue-sdk/releases/download/v${SDK_VERSION}/rexglue-sdk-${SDK_VERSION}-linux-amd64.zip" \
            --output "$archive"
          echo "$SDK_SHA256  $archive" | sha256sum --check --strict
          mkdir -p rexglue
          unzip -q "$archive" -d rexglue

      - name: Download game executable for code generation
        env:
          GH_TOKEN: ${{ secrets.GAME_ASSETS_TOKEN }}
        run: |
          mkdir -p assets
          gh release download "$GAME_ASSETS_TAG" \
            --repo "$GAME_ASSETS_REPOSITORY" --pattern default.xex --dir assets
          test -s assets/default.xex

      - name: Generate recompiled code
        run: |
          chmod +x rexglue/linux-amd64/bin/rexglue
          ./rexglue/linux-amd64/bin/rexglue codegen ge_manifest.toml

      - name: Configure Release
        run: cmake --preset linux-amd64-release

      - name: Build Release
        run: cmake --build --preset linux-amd64-release --parallel 2

      - name: Package executable and runtime libraries
        run: |
          bash .github/scripts/package-linux-release.sh \
            out/build/linux-amd64-release out/release "${GITHUB_SHA:0:7}"

      - name: Upload release build
        uses: actions/upload-artifact@v4
        with:
          name: GoldenEye-linux-amd64
          path: |
            out/release/*.tar.gz
            out/release/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Attach build to GitHub release
    if: github.event_name == 'release'
    needs: build-linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release build
        uses: actions/download-artifact@v4
        with:
          name: GoldenEye-linux-amd64
          path: out/release

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" out/release/*.tar.gz out/release/*.sha256 --clobber
